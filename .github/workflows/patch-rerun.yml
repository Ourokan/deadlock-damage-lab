name: Rerun searches after a patch

# Every 6 hours: check the Deadlock API for a new patch or a hotfix (pipeline/check_patch.py). When the results are
# out of date, pull the new game data and player builds, then rerun the searches one rank tier at a time in
# pipeline/tiers.json order (Phantom and up first, the standard; then Ascendant+, Eternus+, all ranks). Each tier runs
# across 16 machines, commits its results to main and redeploys the site before the next starts
# (rerun-tier.yml). Tiers not in "enabled" are skipped and keep their last results. Nothing is committed for a
# tier unless its searches finish (pipeline/check_results.py). The real item win edge the overall search blends in
# is rebuilt from the same builds (pipeline/refresh_win_edge.py), or kept from the last run when there are too few,
# and the ally item team values are refit on the patch's popular builds (sim/scripts/team/team_value.py, no API),
# both side by side (jobs win_edge and team, merged by fits) before the tiers start.

# A merged change to pipeline/rerun_request.json also forces a rerun, so Claude (which can't press Run workflow)
# can start one when asked.
on:
  push:
    branches: [main]
    paths: [pipeline/rerun_request.json]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rerun even if nothing changed"
        type: boolean
        default: false
      refetch:
        description: "Download player builds even if the cached ones are under 24 hours old"
        type: boolean
        default: false

# One rerun at a time. A forced rerun (a merged rerun_request.json) cancels the one in progress: it runs the newer
# code on the same or newer data, so the older run's results would be replaced anyway. A scheduled check never cancels
# a run; it waits. GitHub keeps one waiting run per group, so a check can replace a waiting forced rerun: the check
# then reruns itself when the request is newer than the results (check_patch.py, "rerun requested").
concurrency:
  group: patch-rerun
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  SHARDS: 16

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      action: ${{ steps.check.outputs.action }}
      reason: ${{ steps.check.outputs.reason }}
      patch_start: ${{ steps.window.outputs.patch_start }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        run: python3 pipeline/check_patch.py --apply ${{ (inputs.force || github.event_name == 'push') && '--force' || '' }}
      - id: window
        run: |
          echo "patch_start=$(python3 -c 'import json; print(json.load(open("data/patch.json"))["patch_start"])')" >> "$GITHUB_OUTPUT"
          echo "### ${{ steps.check.outputs.action }}: ${{ steps.check.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.check.outputs.action == 'rerun'
        uses: actions/upload-artifact@v4
        with:
          name: game
          path: |
            data/game
            data/patch.json

  data:
    needs: detect
    if: needs.detect.outputs.action == 'rerun'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      complete: ${{ steps.fetch.outputs.complete }}
      tiers: ${{ steps.tiers.outputs.tiers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: game
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # player builds are ~50 MB a day and the SQL endpoint allows ~20 queries an hour, so keep what was fetched
      - uses: actions/cache/restore@v4
        with:
          path: data/builds/player_builds
          key: player-builds-${{ needs.detect.outputs.patch_start }}-${{ github.run_id }}
          restore-keys: player-builds-${{ needs.detect.outputs.patch_start }}-
      - id: fetch
        name: Fetch player builds (skipped when the cache is under 24 h old; resumes; stops early near the job time limit)
        # a complete download stamps the folder; within 24 h of that stamp the cached builds are used as they are
        run: |
          stamp=data/builds/player_builds/.fetched_at
          if [ "${{ inputs.refetch }}" != "true" ] && [ -f "$stamp" ] && [ $(( $(date +%s) - $(cat "$stamp") )) -lt 86400 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "Using cached player builds from $(date -u -d @"$(cat "$stamp")" '+%Y-%m-%d %H:%M UTC') (under 24 h old)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          end=$(python3 -c 'import json; print(json.load(open("data/patch.json"))["builds_through"])')
          set +e
          python3 data/scripts/fetch_builds.py data/builds/player_builds data/game/raw/items.json "$end" --max-days 14 --deadline-min 270
          code=$?
          set -e
          if [ $code -eq 0 ]; then date +%s > "$stamp"; echo "complete=true" >> "$GITHUB_OUTPUT";
          elif [ $code -eq 3 ]; then echo "complete=false" >> "$GITHUB_OUTPUT"; echo "Builds not all fetched yet; the next scheduled run continues." >> "$GITHUB_STEP_SUMMARY";
          else exit $code; fi
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: data/builds/player_builds
          key: player-builds-${{ needs.detect.outputs.patch_start }}-${{ github.run_id }}
      - name: Ability orders for the patch
        if: steps.fetch.outputs.complete == 'true'
        run: python3 data/scripts/fetch_analytics.py data/builds/aggregates data/game/raw/heroes.json --slim
      - id: tiers
        name: Rank tiers to rerun (pipeline/tiers.json)
        run: |
          tiers=$(python3 -c 'import json; t = json.load(open("pipeline/tiers.json")); print(json.dumps([b for b in t["order"] if b in t["enabled"]]))')
          echo "tiers=$tiers" >> "$GITHUB_OUTPUT"
          echo "Rank tiers: $tiers" >> "$GITHUB_STEP_SUMMARY"
      - name: Opponent pools for the standard bracket and every tier that runs
        if: steps.fetch.outputs.complete == 'true'
        run: |
          brackets=$(python3 -c 'import json, sys; sys.path.insert(0, "search/scripts"); from build_pool import PRIMARY; print(" ".join(dict.fromkeys([PRIMARY] + json.loads(sys.argv[1]))))' '${{ steps.tiers.outputs.tiers }}')
          for b in $brackets; do
            python3 search/scripts/build_pool.py $b
          done
      - if: steps.fetch.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: inputs
          path: |
            data/builds/aggregates
            search/work/snapshots_*.json
            search/work/item_usage*.json
            search/work/tier_caps*.json

  # the two fits the overall search reads, side by side once the pools are built (they used to run one after the
  # other in the data job, ~20 min): the real item win edge, and the team value refit split over 7 machines
  win_edge:
    needs: [detect, data]
    if: needs.data.outputs.complete == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: game
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data/builds/player_builds
          key: player-builds-${{ needs.detect.outputs.patch_start }}-${{ github.run_id }}
          restore-keys: player-builds-${{ needs.detect.outputs.patch_start }}-
      - name: Real item win edge from the patch's builds (keeps the last snapshot when there are too few matches)
        continue-on-error: true   # the overall search then blends the last snapshot, as when there are too few
        run: python3 pipeline/refresh_win_edge.py data/builds/player_builds --workers 3
      - uses: actions/upload-artifact@v4
        with:
          name: edge
          path: analysis/out/hero_item_edge.json

  team:
    needs: [detect, data]
    if: needs.data.outputs.complete == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6]   # one ally item each (the 7 of team_value.ALLY_ITEMS; --of below matches)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: game
          path: data
      - uses: actions/download-artifact@v4
        with:
          name: inputs
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ally item team values from 3v3 fights of the patch's popular builds (part ${{ matrix.part }} of 7)
        continue-on-error: true   # a missing part keeps the last fit (fits job)
        working-directory: sim
        run: |
          mkdir -p work/team_parts
          python3 scripts/team/team_value.py --workers 4 --require-pools --part ${{ matrix.part }} --of 7 \
            --part-out work/team_parts/part_${{ matrix.part }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: team-part-${{ matrix.part }}
          path: sim/work/team_parts

  fits:
    needs: [detect, data, win_edge, team]
    # runs when a fit failed too: that one keeps its last committed values
    if: ${{ !cancelled() && needs.data.outputs.complete == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: game
          path: data
      - uses: actions/download-artifact@v4
        continue-on-error: true   # no edge artifact: the last snapshot (in the checkout) stays
        with:
          name: edge
          path: analysis/out
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: team-part-*
          path: sim/work/team_parts
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge the team value parts (keeps the last fit when a part failed)
        continue-on-error: true   # team_value.json is only written when every part is there
        working-directory: sim
        run: |
          python3 scripts/team/team_value.py --merge work/team_parts || {
            echo "Ally item team values: refit failed, the overall search uses the last fit (sim/data/team_value.json)." >> "$GITHUB_STEP_SUMMARY"
            exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: fits
          path: |
            analysis/out/hero_item_edge.json
            sim/data/team_value.json

  tier_phantom:
    needs: [detect, data, fits]
    # runs after the tier before it whether that ran, failed or was switched off
    if: ${{ !cancelled() && needs.data.outputs.complete == 'true' && needs.fits.result == 'success' && contains(fromJSON(needs.data.outputs.tiers || '[]'), 'phantom') }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/rerun-tier.yml
    with:
      tier: phantom
      reason: ${{ needs.detect.outputs.reason }}

  tier_ascendant:
    needs: [detect, data, fits, tier_phantom]
    # runs after the tier before it whether that ran, failed or was switched off, but not when the standard tier
    # (Phantom+) failed: its publish carries the new game data, and a later tier committing it first would leave
    # Phantom+ on the old patch's results with the patch marked as done
    if: ${{ !cancelled() && needs.data.outputs.complete == 'true' && needs.fits.result == 'success' && needs.tier_phantom.result != 'failure' && contains(fromJSON(needs.data.outputs.tiers || '[]'), 'ascendant') }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/rerun-tier.yml
    with:
      tier: ascendant
      reason: ${{ needs.detect.outputs.reason }}

  tier_eternus:
    needs: [detect, data, fits, tier_phantom, tier_ascendant]
    # runs after the tier before it whether that ran, failed or was switched off, but not when the standard tier
    # (Phantom+) failed: its publish carries the new game data, and a later tier committing it first would leave
    # Phantom+ on the old patch's results with the patch marked as done
    if: ${{ !cancelled() && needs.data.outputs.complete == 'true' && needs.fits.result == 'success' && needs.tier_phantom.result != 'failure' && contains(fromJSON(needs.data.outputs.tiers || '[]'), 'eternus') }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/rerun-tier.yml
    with:
      tier: eternus
      reason: ${{ needs.detect.outputs.reason }}

  tier_all:
    needs: [detect, data, fits, tier_phantom, tier_eternus]
    # runs after the tier before it whether that ran, failed or was switched off, but not when the standard tier
    # (Phantom+) failed: its publish carries the new game data, and a later tier committing it first would leave
    # Phantom+ on the old patch's results with the patch marked as done
    if: ${{ !cancelled() && needs.data.outputs.complete == 'true' && needs.fits.result == 'success' && needs.tier_phantom.result != 'failure' && contains(fromJSON(needs.data.outputs.tiers || '[]'), 'all') }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/rerun-tier.yml
    with:
      tier: all
      reason: ${{ needs.detect.outputs.reason }}
