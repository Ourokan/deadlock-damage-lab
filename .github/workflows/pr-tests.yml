name: PR tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every script
        run: python3 -m compileall -q sim damage search survival counters pipeline web analysis
      - name: Sim unit tests
        working-directory: sim
        run: python3 -m unittest discover -s tests -v
      - name: Search smoke test
        run: python3 pipeline/smoke_test.py
