name: Claude review

# Claude reviews every pull request and leaves comments on it.
# Needs one repo secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, uses a Claude Pro/Max plan)
# or swap the input below for anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip until the secret is set
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add the CLAUDE_CODE_OAUTH_TOKEN repo secret to turn on Claude review"
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This repo is a Deadlock combat simulator (sim/deadsim, Python stdlib only)
            plus build searches (search/, damage/, survival/) that GitHub Actions reruns after each patch, and a
            static web page (web/). Focus on:
            - bugs and wrong game math (damage, resistances, cooldowns, item effects)
            - changes that silently shift search results or break the patch-rerun workflow
            - missing or weakened tests
            Skip style nits. Use inline comments for specific lines and one short summary comment with
            `gh pr comment`. Say plainly when you find nothing blocking.
          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
