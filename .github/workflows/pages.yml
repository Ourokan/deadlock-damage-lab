name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:    # from patch-rerun.yml after it commits new results
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Pyodide core
        run: |
          curl -sSL -o pyodide-core.tar.bz2 https://github.com/pyodide/pyodide/releases/download/0.26.4/pyodide-core-0.26.4.tar.bz2
          mkdir -p /tmp/pyodide && tar xjf pyodide-core.tar.bz2 -C /tmp/pyodide
      - name: Build site data
        run: python3 web/build.py --pyodide /tmp/pyodide/pyodide
      # don't deploy a site whose browser sim or tabs break (rerun commits land on main without a PR)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test the site in the browser
        run: |
          # network installs get a second try, so an npm or apt hiccup doesn't block the run
          for i in 1 2; do npm install --prefix web/tests --no-package-lock && break; [ $i = 2 ] && exit 1; sleep 20; done
          for i in 1 2; do (cd web/tests && npx playwright install --with-deps chromium) && break; [ $i = 2 ] && exit 1; sleep 20; done
          # a second try only here: a real break fails twice, a runner hiccup shouldn't hold back rerun results
          node web/tests/browser_test.cjs || node web/tests/browser_test.cjs
          rm -rf web/tests
      - name: Drop preview-only files
        run: rm -f web/artifact.html web/py/*.b64.txt web/vendor/pyodide/*.b64.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
